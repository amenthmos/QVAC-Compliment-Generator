<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Compliment Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #fff0f5 0%, #ffe0ec 100%);
    font-family: system-ui, sans-serif;
    color: #6b2d45;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; text-align: center; }
  .icon { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #c2185b; font-weight: 800; }
  .subtitle { color: #9c5470; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: #fffafc;
    border: 2px solid #f3b6cd;
    border-radius: 20px;
    padding: 30px 26px;
    text-align: left;
  }
  label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: #8a3d5a; }
  input[type=text], textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #f3b6cd;
    background: #fff;
    color: #6b2d45;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 16px;
    resize: vertical;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #d6336c;
    color: #fff;
    box-shadow: 0 5px 0 #a01f4f;
    width: 100%;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #a01f4f; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #a15774; min-height: 1.2em; text-align: center; }
  .result-body { font-size: 1.1rem; line-height: 1.6; margin: 20px 0 4px; color: #6b2d45; font-weight: 600; background: #fff0f5; border-radius: 14px; padding: 16px; }
  .footer-note { color: #a15774; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #f3b6cd;
    border-top-color: #d6336c;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">💛</div>
    <h1>QVAC Compliment Generator</h1>
    <p class="subtitle">Describe someone and what they did — get a genuine, specific compliment. 100% on-device.</p>

    <div class="card">
      <label for="personInput">Who is it about?</label>
      <input type="text" id="personInput" placeholder="e.g. my sister, my coworker Alex" />

      <label for="detailInput">What did they do or say?</label>
      <textarea id="detailInput" rows="3" placeholder="e.g. drove two hours to help me move apartments on a workday"></textarea>

      <button class="action" id="generateBtn">Generate Compliment</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const personInput = document.getElementById('personInput');
    const detailInput = document.getElementById('detailInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const person = personInput.value.trim();
      const detail = detailInput.value.trim();
      if (!person || !detail) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Thinking of something genuine...';

      try {
        const res = await fetch('/api/compliment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ person, detail }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="result-body">${escapeHtml(data.compliment)}</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
